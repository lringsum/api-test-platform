name: Backend Regression

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  backend-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        env:
          AUTO_DB_BOOTSTRAP: "false"
        run: flask --app run.py db upgrade

      - name: Run tests
        env:
          AUTO_DB_BOOTSTRAP: "false"
        run: pytest -q tests
